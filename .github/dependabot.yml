version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # FastEmbed requires huggingface-hub<2. Remove when its bound changes.
      - dependency-name: huggingface-hub
        versions: ['>=2.0.0']
    groups:
      python:
        patterns: ['*']
        update-types: [minor, patch]
