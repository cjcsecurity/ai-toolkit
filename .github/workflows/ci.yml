name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lexical:
    name: Standard library / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run manager tests without optional dependencies
        run: python -m unittest discover -s tests -v
      - name: Check generated documentation and local links
        run: python scripts/generate_catalog_docs.py --check
      - name: Bootstrap catalog-only lexical retrieval
        run: python scripts/bootstrap.py
      - name: Exercise repository discovery
        run: bin/toolkit search "browser automation" --kind repo --limit 8 --lexical

  optional-dependencies:
    name: Optional vector and MCP client tests / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install optional test dependencies
        # Resolve both files together so stale generated pins fail dependency PRs.
        run: python -m pip install -r requirements-search.txt -r requirements-rag.txt
      - name: Run tests with vector operations and MCP client available
        run: python -m unittest discover -s tests -v
